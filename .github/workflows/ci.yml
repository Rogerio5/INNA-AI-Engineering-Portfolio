name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PHOENIX_ENABLED: "false"
      INNA_KNOWLEDGE_GRAPH_ENABLED: "false"
      INNA_LLAMAINDEX_AGENTIC_RAG_ENABLED: "false"
      INNA_DEEPEVAL_ENABLED: "false"
      INNA_DEEPEVAL_LIVE: "false"
      PYTHONNOUSERSITE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements/runtime.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Install project
        run: python -m pip install -e . --no-deps

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile package
        run: python -m compileall src/inna_ai tests -q -f

      - name: Run structural tests
        run: python -m pytest tests -q -ra
