[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inna-ai-engineering-portfolio"
version = "0.1.0"
description = "AI Engineering portfolio with LangGraph, Agentic RAG, evaluation and observability."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Rogério Augusto Sabino" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
